<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Digital Physics Laboratory</title>

  <link rel="stylesheet" href="styles.css?v=20260909-ux-12">
</head>
<body>



  <div class="app-shell" id="appShell">

    <button class="floating-burger" id="floatingBurger" type="button" aria-label="Открыть меню">
      <span class="floating-burger-inner"><span></span><span></span><span></span></span>
    </button>
    <header class="topbar" id="topbar">
      <button class="menu-button" id="menuButton" aria-label="Открыть меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <button class="brand brand-button" id="brandHome" type="button" aria-label="На главную">
        <span class="phi-logo">φ</span>
        <div class="brand-copy">
          <div class="brand-title">Digital Physics Laboratory</div>
          <div class="brand-subtitle" id="pageSubtitle">Интерактивные эксперименты по физике</div>
        </div>
      </button>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar" aria-label="Навигация по лаборатории">
      <div class="sidebar-head">
        <button class="sidebar-brand-home" id="sidebarBrandHome" type="button" aria-label="На главную">
          <span class="phi-logo">φ</span>
          <span class="sidebar-brand-text">
            <strong>Digital Physics Laboratory</strong>
            <small>Интерактивная физика</small>
          </span>
        </button>
      </div>

      <nav class="nav" id="experimentNav"></nav>
    </aside>

    <main class="workspace">
      <section class="welcome" id="welcomeScreen">
        <div class="welcome-glass">
          <div class="eyebrow">Digital Physics Laboratory</div>
          <h1>Физика, которую можно увидеть</h1>
          <p>
            Интерактивные модели для уроков: меняй параметры, запускай эксперимент
            и сразу смотри, как меняется движение.
          </p>
        </div>
      </section>

      <section class="experiment-stage" id="experimentStage" hidden>
        <div id="experimentMount"></div>
      </section>
    </main>
  </div>

  <script src="app.js?v=20260909-ux-final"></script>
</body>
</html>
