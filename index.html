<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Digital Physics Laboratory</title>
  <style>



*{box-sizing:border-box}

:root{
  --bg-a:#9b7bea;
  --bg-b:#c96fa8;
  --bg-c:#ed7198;
  --panel:#fff;
  --panel-soft:#f7f8fc;
  --text:#202536;
  --muted:#697086;
  --border:#e3e7f0;
  --accent:#5964df;
  --accent-soft:#eef0ff;
  --shadow:0 10px 30px rgba(45,38,90,.10);
  --sidebar-width:318px;
}

html,body{
  margin:0;
  min-height:100%;
  font-family:Arial,sans-serif;
  color:var(--text);
  background:
    radial-gradient(circle at 15% 10%,rgba(255,255,255,.42),transparent 28%),
    radial-gradient(circle at 86% 18%,rgba(255,255,255,.18),transparent 24%),
    linear-gradient(135deg,var(--bg-a) 0%,var(--bg-b) 52%,var(--bg-c) 100%);
  background-attachment:fixed;
}

body{overflow-x:hidden}
button,input,select{font:inherit}
button{-webkit-tap-highlight-color:transparent}

.app-shell{
  min-height:100vh;
  padding:clamp(10px,2vw,22px);
}

.topbar{
  position:relative;
  z-index:20;
  display:flex;
  align-items:center;
  gap:12px;
  min-height:66px;
  padding:10px 14px;
  margin-bottom:16px;
  background:rgba(255,255,255,.82);
  border:1px solid rgba(255,255,255,.62);
  border-radius:18px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);
}

.menu-button{
  width:44px;height:44px;flex:0 0 44px;
  display:grid;place-content:center;gap:4px;
  border:0;border-radius:11px;background:var(--accent-soft);cursor:pointer
}
.menu-button span{display:block;width:20px;height:2px;border-radius:999px;background:var(--accent)}

.brand-button{
  border:0;background:transparent;padding:0;cursor:pointer;text-align:left
}
.brand{
  display:flex;align-items:center;gap:10px;min-width:0;color:inherit
}
.brand-mark{
  width:40px;height:40px;border-radius:12px;
  display:grid;place-items:center;
  color:#fff;font-family:Georgia,serif;font-size:24px;font-style:italic;
  background:linear-gradient(135deg,#7f6ee9,#d76fa5);
  box-shadow:0 5px 14px rgba(111,88,199,.24)
}
.brand-copy{min-width:0}
.brand-title{font-size:clamp(17px,2vw,21px);line-height:1.15;font-weight:700}
.brand-subtitle{
  margin-top:3px;font-size:12px;color:var(--muted);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}

.sidebar{
  position:fixed;z-index:40;inset:0 auto 0 0;
  width:min(var(--sidebar-width),calc(100vw - 28px));
  padding:18px;
  background:rgba(255,255,255,.97);
  box-shadow:18px 0 45px rgba(30,40,70,.22);
  transform:translateX(-105%);
  transition:transform .22s ease;
  overflow-y:auto;
}
.sidebar.open{transform:translateX(0)}

.sidebar-backdrop{
  position:fixed;z-index:30;inset:0;
  background:rgba(22,24,38,.30);
  backdrop-filter:blur(2px);
  opacity:0;pointer-events:none;transition:opacity .2s ease
}
.sidebar-backdrop.open{opacity:1;pointer-events:auto}

.sidebar-head{
  display:flex;align-items:flex-start;justify-content:space-between;gap:12px;
  padding:4px 2px 16px;margin-bottom:10px;border-bottom:1px solid var(--border)
}
.sidebar-kicker{
  font-size:10px;font-weight:700;letter-spacing:.08em;color:#8b90a2;text-transform:uppercase
}
.sidebar-title{margin-top:4px;font-size:24px;font-weight:700}
.sidebar-close{
  width:40px;height:40px;border:0;border-radius:10px;
  background:var(--panel-soft);color:#545b70;font-size:28px;line-height:1;cursor:pointer
}

.nav{display:grid;gap:9px}

.nav-section{
  border:1px solid #e4e7f0;
  border-radius:15px;
  background:#fff;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(42,48,80,.035);
  transition:border-color .18s ease,box-shadow .18s ease
}
.nav-section.open{
  border-color:#d8dcf3;
  box-shadow:0 7px 18px rgba(75,72,130,.07)
}

.nav-section-button{
  width:100%;
  min-height:54px;
  display:flex;align-items:center;justify-content:space-between;gap:12px;
  padding:12px 14px;
  border:0;background:#fff;color:var(--text);
  font-weight:700;text-align:left;cursor:pointer
}
.nav-section-button:hover{background:#fafaff}

.nav-section-left{display:flex;align-items:center;gap:10px}
.nav-section-icon{
  width:31px;height:31px;border-radius:9px;
  display:grid;place-items:center;
  background:#f1f2ff;color:#5964df;font-size:16px
}

.nav-chevron{
  color:#7e8498;font-size:20px;
  transform:rotate(0deg);
  transition:transform .2s ease
}
.nav-section.open .nav-chevron{transform:rotate(90deg)}

.nav-experiments{
  display:grid;
  grid-template-rows:0fr;
  opacity:0;
  transition:grid-template-rows .22s ease,opacity .18s ease
}
.nav-section.open .nav-experiments{
  grid-template-rows:1fr;
  opacity:1
}
.nav-experiments-inner{
  min-height:0;
  overflow:hidden;
  padding:0 8px
}
.nav-section.open .nav-experiments-inner{
  padding-bottom:8px
}

.nav-experiment{
  width:100%;display:block;
  padding:10px 11px;margin-top:4px;
  border:0;border-radius:10px;
  background:transparent;color:#555c70;
  text-align:left;cursor:pointer
}
.nav-experiment:hover{
  background:#f7f8fc;color:var(--text)
}
.nav-experiment.active{
  background:linear-gradient(135deg,#eef0ff,#f7eff8);
  color:#4d56c8;font-weight:700
}
.nav-experiment-title{display:block;font-weight:700}
.nav-experiment-subtitle{
  display:block;margin-top:3px;font-size:12px;font-weight:400;color:#9196a7
}
.nav-empty{
  padding:8px 11px 10px;
  font-size:12px;color:#a1a5b5
}

.workspace{min-width:0}

.welcome{
  min-height:calc(100vh - 120px);
  display:grid;
  align-content:center;
  gap:18px;
  padding:clamp(4px,2vw,10px)
}

.welcome-glass{
  max-width:930px;
  padding:clamp(28px,5vw,58px);
  border:1px solid rgba(255,255,255,.46);
  border-radius:24px;
  background:rgba(255,255,255,.78);
  box-shadow:0 18px 50px rgba(47,34,87,.14);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px)
}

.eyebrow{
  margin-bottom:10px;font-size:12px;font-weight:700;letter-spacing:.08em;
  color:var(--accent);text-transform:uppercase
}
.welcome h1{
  max-width:760px;margin:0;
  font-size:clamp(36px,6vw,72px);line-height:.98;letter-spacing:-.035em
}
.welcome p{
  max-width:720px;margin:18px 0 0;
  font-size:clamp(15px,2vw,18px);line-height:1.65;color:var(--muted)
}

.primary-cta{background:#5964df;color:#fff}
.secondary-cta{background:#eef0ff;color:#4d56c8}

.welcome-grid{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;
  max-width:930px
}
.quick-card{
  position:relative;min-height:155px;padding:20px;
  border:1px solid rgba(255,255,255,.48);
  border-radius:18px;background:rgba(255,255,255,.80);
  box-shadow:0 12px 30px rgba(45,38,90,.10);
  color:var(--text);text-align:left;cursor:pointer;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  transition:transform .15s ease,background .15s ease
}
.quick-card:hover{transform:translateY(-2px);background:rgba(255,255,255,.92)}
.quick-card-icon{
  position:absolute;right:16px;top:15px;
  width:34px;height:34px;border-radius:10px;
  display:grid!important;place-items:center;
  background:#eef0ff;color:#5964df;font-weight:700
}
.quick-card-section{
  display:block;margin-bottom:12px;color:var(--accent);font-size:12px;font-weight:700
}
.quick-card strong{display:block;margin-bottom:8px;padding-right:42px;font-size:18px}
.quick-card span:last-child{display:block;color:var(--muted);font-size:14px;line-height:1.45}

.experiment-stage{
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:var(--shadow);
  overflow:hidden
}
#experimentMount{min-width:0}

.placeholder{padding:clamp(24px,5vw,54px)}
.placeholder-label{
  color:var(--accent);font-size:12px;font-weight:700;letter-spacing:.07em;text-transform:uppercase
}
.placeholder h1{margin:8px 0 12px;font-size:clamp(26px,4vw,42px)}
.placeholder p{max-width:720px;margin:0;color:var(--muted);line-height:1.6}
.placeholder-note{
  margin-top:18px;padding:14px 16px;border:1px solid #e7e9f1;
  border-radius:12px;background:#f7f8fc;font-size:14px;line-height:1.55
}


.catalog-card{
  max-width:930px;
  overflow:hidden;
  border:1px solid rgba(255,255,255,.5);
  border-radius:20px;
  background:rgba(255,255,255,.86);
  box-shadow:0 12px 30px rgba(45,38,90,.10);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
}
.catalog-section + .catalog-section{border-top:1px solid #e7e9f2}
.catalog-section-button{
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:18px 20px;
  border:0;
  background:transparent;
  color:var(--text);
  font-size:18px;
  font-weight:700;
  text-align:left;
  cursor:pointer;
}
.catalog-section-button:hover{background:rgba(247,248,252,.75)}
.catalog-chevron{color:#777e94;font-size:20px}
.catalog-items{display:none;padding:0 12px 12px 28px}
.catalog-items.open{display:block}
.catalog-experiment{
  width:100%;
  display:block;
  padding:11px 14px;
  border:0;
  border-radius:10px;
  background:transparent;
  color:#5964df;
  text-align:left;
  cursor:pointer;
  font-size:15px;
}
.catalog-experiment:hover{background:#f1f2ff}

@media(min-width:1050px){
  .app-shell{
    display:grid;
    grid-template-columns:var(--sidebar-width) minmax(0,1fr);
    grid-template-rows:auto 1fr;
    column-gap:18px
  }
  .topbar{grid-column:2;grid-row:1}
  .workspace{grid-column:2;grid-row:2}
  .sidebar{
    position:sticky;top:22px;grid-column:1;grid-row:1 / span 2;
    width:100%;height:calc(100vh - 44px);
    transform:none;border:1px solid rgba(255,255,255,.62);
    border-radius:18px;background:rgba(255,255,255,.88);
    box-shadow:var(--shadow);
    backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)
  }
  .sidebar-close,.menu-button,.sidebar-backdrop{display:none}
}

@media(max-width:700px){
  .app-shell{padding:10px}
  .topbar{min-height:58px;border-radius:14px;margin-bottom:10px}
  .brand-mark{width:36px;height:36px;border-radius:10px;font-size:21px}
  .welcome{min-height:calc(100vh - 90px);padding:0}
  .welcome-glass{border-radius:18px;padding:24px 20px}
  .welcome-grid{grid-template-columns:1fr}
  .quick-card{min-height:130px;border-radius:16px}
  .experiment-stage{border-radius:14px}
}

@media(prefers-reduced-motion:reduce){
  *{scroll-behavior:auto!important;transition:none!important}
}


/* ===== Approved UX behavior ===== */
:root{
  --sidebar-width:248px;
}

.app-shell{
  transition:grid-template-columns .22s ease;
}

.app-shell.experiment-mode .topbar{
  display:none !important;
}

.app-shell.experiment-mode{
  padding-top:22px;
}

.sidebar-head{
  align-items:center;
}

.sidebar-home{
  flex:1;
  min-width:0;
  border:0;
  border-radius:10px;
  padding:9px 10px;
  background:var(--accent-soft);
  color:#4d56c8;
  font-weight:700;
  text-align:left;
  cursor:pointer;
}

.sidebar-close{
  display:none;
}

.sidebar-collapse{
  display:none;
}

/* Floating burger appears only when the sidebar is fully collapsed */
.floating-burger{
  position:fixed;
  z-index:60;
  left:20px;
  top:20px;
  width:46px;
  height:46px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:14px;
  background:rgba(255,255,255,.92);
  box-shadow:0 10px 28px rgba(45,38,90,.18);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:none;
  align-items:center;
  justify-content:center;
  cursor:pointer;
}

.floating-burger span{
  display:block;
  width:19px;
  height:2px;
  margin:3px 0;
  border-radius:999px;
  background:var(--accent);
}

.floating-burger-inner{
  display:grid;
  gap:2px;
}

.catalog-empty{
  padding:8px 14px 12px;
  color:#a1a5b5;
  font-size:13px;
}

/* Current experiment highlight */
.nav-experiment.active{
  background:linear-gradient(135deg,rgba(89,100,223,.13),rgba(207,111,166,.11));
  color:#4f58c9;
  box-shadow:inset 3px 0 0 var(--accent);
}

.nav-experiment.active .nav-experiment-title{
  font-weight:700;
}

.nav-section.active-section > .nav-section-button{
  background:rgba(246,247,255,.9);
  color:#4f58c9;
}

/* Desktop behavior */
@media(min-width:1050px){
  .app-shell{
    grid-template-columns:var(--sidebar-width) minmax(0,1fr);
  }

  .app-shell.menu-collapsed{
    grid-template-columns:0 minmax(0,1fr);
    column-gap:0;
  }

  .app-shell.menu-collapsed .sidebar{
    opacity:0;
    transform:translateX(calc(-100% - 24px));
    pointer-events:none;
  }

  .app-shell.menu-collapsed .floating-burger{
    display:flex;
  }

  .sidebar{
    transition:opacity .18s ease, transform .22s ease;
  }

  .experiment-stage{
    transition:margin-left .22s ease;
  }
}

/* Tablet / mobile: sidebar becomes an overlay, burger remains available in experiment mode */
@media(max-width:1049px){
  .floating-burger{
    display:none;
  }

  .app-shell.experiment-mode .floating-burger{
    display:flex;
  }

  .app-shell.experiment-mode .menu-button{
    display:none !important;
  }

  .sidebar-close{
    display:block;
  }
}

@media(max-width:700px){
  .app-shell.experiment-mode{
    padding-top:10px;
  }

  .floating-burger{
    left:14px;
    top:14px;
    width:44px;
    height:44px;
  }
}




/* ===== Mobile experiment chrome: burger + home only ===== */
.experiment-home-fab{
  position:fixed;
  z-index:61;
  right:20px;
  top:20px;
  width:46px;
  height:46px;
  border:1px solid rgba(255,255,255,.55);
  border-radius:14px;
  background:rgba(255,255,255,.92);
  box-shadow:0 10px 28px rgba(45,38,90,.18);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  display:none;
  place-items:center;
  cursor:pointer;
  color:#fff;
}

.experiment-home-fab .mini-brand-mark{
  width:32px;
  height:32px;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-family:Georgia,serif;
  font-size:21px;
  font-style:italic;
  background:linear-gradient(135deg,#7f6ee9,#d76fa5);
}

/* In experiment mode, show only the two floating controls */
.app-shell.experiment-mode .experiment-home-fab{
  display:grid;
}

@media(max-width:1049px){
  /* Force menu completely off-screen after experiment selection */
  .app-shell.experiment-mode .sidebar:not(.open){
    transform:translateX(-105%) !important;
    opacity:0;
    pointer-events:none;
  }

  .app-shell.experiment-mode .sidebar.open{
    transform:translateX(0) !important;
    opacity:1;
    pointer-events:auto;
  }

  .app-shell.experiment-mode .sidebar-backdrop:not(.open){
    opacity:0;
    pointer-events:none;
  }

  .app-shell.experiment-mode .floating-burger{
    display:flex;
  }
}

@media(max-width:700px){
  .experiment-home-fab{
    right:14px;
    top:14px;
    width:44px;
    height:44px;
  }

  .experiment-home-fab .mini-brand-mark{
    width:30px;
    height:30px;
    font-size:20px;
  }
}



/* ===== Single-menu UX: no duplicated central catalog ===== */
.welcome{
  display:grid;
  align-content:center;
}

.welcome-glass{
  margin-bottom:0;
}

/* On mobile home screen the sidebar is the only catalog and opens by default. */
@media(max-width:1049px){
  .app-shell:not(.experiment-mode) .sidebar.open{
    transform:translateX(0) !important;
    opacity:1;
    pointer-events:auto;
  }
}



[hidden]{display:none!important;}

.app-shell.experiment-mode #welcomeScreen{
  display:none !important;
}

</style>
</head>
<body>



  <div class="app-shell" id="appShell">
    <button class="experiment-home-fab" id="experimentHomeFab" type="button" aria-label="На главную">
      <span class="mini-brand-mark">φ</span>
    </button>

    <button class="floating-burger" id="floatingBurger" type="button" aria-label="Открыть меню">
      <span class="floating-burger-inner"><span></span><span></span><span></span></span>
    </button>
    <header class="topbar" id="topbar">
      <button class="menu-button" id="menuButton" aria-label="Открыть меню" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>

      <button class="brand brand-button" id="brandHome" type="button" aria-label="На главную">
        <div class="brand-mark">φ</div>
        <div class="brand-copy">
          <div class="brand-title">Digital Physics Laboratory</div>
          <div class="brand-subtitle" id="pageSubtitle">Интерактивные эксперименты по физике</div>
        </div>
      </button>
    </header>

    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <aside class="sidebar" id="sidebar" aria-label="Навигация по лаборатории">
      <div class="sidebar-head">
        <button class="sidebar-home" id="homeButton" type="button">← На главную</button>
        <button class="sidebar-close" id="sidebarClose" aria-label="Закрыть меню">×</button>
      </div>

      <nav class="nav" id="experimentNav"></nav>
    </aside>

    <main class="workspace">
      <section class="welcome" id="welcomeScreen">
        <div class="welcome-glass">
          <div class="eyebrow">Digital Physics Laboratory</div>
          <h1>Физика, которую можно увидеть</h1>
          <p>
            Интерактивные модели для уроков: меняй параметры, запускай эксперимент
            и сразу смотри, как меняется движение.
          </p>
        </div>
      </section>

      <section class="experiment-stage" id="experimentStage" hidden>
        <div id="experimentMount"></div>
      </section>
    </main>
  </div>

  

<script>




const catalog = [
  {
    id:"kinematics",
    title:"Кинематика",
    icon:"↗",
    experiments:[
      { id:"ballistics", title:"Баллистика", subtitle:"Движение тела под углом" }
    ]
  },
  { id:"dynamics", title:"Динамика", icon:"→", experiments:[] },
  { id:"statics", title:"Статика", icon:"⌁", experiments:[] },
  { id:"conservation", title:"Законы сохранения", icon:"Σ", experiments:[] },
  { id:"molecular", title:"Молекулярная физика", icon:"◌", experiments:[] },
  { id:"thermodynamics", title:"Термодинамика", icon:"△", experiments:[] },
  { id:"electrostatics", title:"Электростатика", icon:"±", experiments:[] },
  { id:"electrodynamics", title:"Электродинамика", icon:"ϟ", experiments:[] },
  {
    id:"magnetism",
    title:"Магнетизм",
    icon:"⊙",
    experiments:[
      {
        id:"charged-particle-3d",
        title:"Заряженная частица в электрическом и магнитном полях",
        subtitle:"Сила Лоренца"
      }
    ]
  },
  { id:"oscillations", title:"Колебания и волны", icon:"∿", experiments:[] },
  { id:"optics", title:"Оптика", icon:"◇", experiments:[] },
  { id:"quantum", title:"Квантовая физика", icon:"h", experiments:[] }
];

const appShell = document.getElementById("appShell");
const nav = document.getElementById("experimentNav");
const sidebar = document.getElementById("sidebar");
const backdrop = document.getElementById("sidebarBackdrop");
const menuButton = document.getElementById("menuButton");
const sidebarClose = document.getElementById("sidebarClose");
const floatingBurger = document.getElementById("floatingBurger");
const experimentHomeFab = document.getElementById("experimentHomeFab");
const homeButton = document.getElementById("homeButton");
const brandHome = document.getElementById("brandHome");
const welcome = document.getElementById("welcomeScreen");
const stage = document.getElementById("experimentStage");
const mount = document.getElementById("experimentMount");

let currentExperimentId = null;
let currentSectionId = null;

function findExperiment(id){
  for(const section of catalog){
    const exp = section.experiments.find(e => e.id === id);
    if(exp) return { section, exp };
  }
  return null;
}

function buildNavigation(){
  nav.innerHTML = "";

  for(const section of catalog){
    const wrap = document.createElement("section");
    wrap.className = "nav-section";
    wrap.dataset.sectionId = section.id;

    const button = document.createElement("button");
    button.type = "button";
    button.className = "nav-section-button";
    button.innerHTML = `
      <span class="nav-section-left">
        <span class="nav-section-icon">${section.icon}</span>
        <span>${section.title}</span>
      </span>
      <span class="nav-chevron">›</span>
    `;

    const expWrap = document.createElement("div");
    expWrap.className = "nav-experiments";

    const inner = document.createElement("div");
    inner.className = "nav-experiments-inner";

    if(section.experiments.length){
      for(const exp of section.experiments){
        const expButton = document.createElement("button");
        expButton.type = "button";
        expButton.className = "nav-experiment";
        expButton.dataset.experimentId = exp.id;
        expButton.innerHTML = `
          <span class="nav-experiment-title">${exp.title}</span>
          <span class="nav-experiment-subtitle">${exp.subtitle || ""}</span>
        `;
        expButton.addEventListener("click", () => openExperiment(exp.id));
        inner.appendChild(expButton);
      }
    } else {
      const empty = document.createElement("div");
      empty.className = "nav-empty";
      empty.textContent = "Эксперименты добавим позже";
      inner.appendChild(empty);
    }

    button.addEventListener("click", () => {
      const willOpen = !wrap.classList.contains("open");

      document.querySelectorAll(".nav-section").forEach(sectionEl => {
        if(sectionEl !== wrap && !sectionEl.classList.contains("active-section")){
          sectionEl.classList.remove("open");
        }
      });

      wrap.classList.toggle("open", willOpen);
    });

    expWrap.appendChild(inner);
    wrap.append(button, expWrap);
    nav.appendChild(wrap);
  }
}

function syncActiveNavigation(){
  document.querySelectorAll(".nav-section").forEach(sectionEl => {
    const isActiveSection = sectionEl.dataset.sectionId === currentSectionId;
    sectionEl.classList.toggle("active-section", isActiveSection);

    if(isActiveSection){
      sectionEl.classList.add("open");
    }
  });

  document.querySelectorAll(".nav-experiment").forEach(button => {
    button.classList.toggle("active", button.dataset.experimentId === currentExperimentId);
  });
}

function showSidebar(){
  if(window.innerWidth >= 1050){
    appShell.classList.remove("menu-collapsed");
    syncActiveNavigation();
  }else{
    sidebar.classList.add("open");
    backdrop.classList.add("open");
    menuButton?.setAttribute("aria-expanded", "true");
    syncActiveNavigation();
  }
}

function hideSidebar(){
  if(window.innerWidth >= 1050){
    appShell.classList.add("menu-collapsed");
  }else{
    sidebar.classList.remove("open");
    backdrop.classList.remove("open");
    menuButton?.setAttribute("aria-expanded", "false");
  }
}

function openHome(){
  currentExperimentId = null;
  currentSectionId = null;

  welcome.hidden = false;
  welcome.style.display = "";
  stage.hidden = true;
  welcome.hidden = false;
  mount.innerHTML = "";

  appShell.classList.remove("experiment-mode", "menu-collapsed");
  sidebar.classList.remove("open");
  backdrop.classList.remove("open");

  document.querySelectorAll(".nav-experiment").forEach(el => el.classList.remove("active"));
  document.querySelectorAll(".nav-section").forEach(el => {
    el.classList.remove("active-section", "open");
  });

  if(location.hash){
    history.replaceState(null, "", location.pathname + location.search);
  }

  if(window.innerWidth < 1050){
    sidebar.classList.add("open");
    backdrop.classList.add("open");
    menuButton?.setAttribute("aria-expanded", "true");
  }
}

function openExperiment(id){
  const found = findExperiment(id);
  if(!found) return;

  currentExperimentId = id;
  currentSectionId = found.section.id;
  syncActiveNavigation();

  welcome.hidden = true;
  welcome.style.display = "none";
  stage.hidden = false;
  stage.style.display = "";
  appShell.classList.add("experiment-mode");
  mount.innerHTML = `
    <div class="placeholder">
      <div class="placeholder-label">${found.section.title}</div>
      <h1>${found.exp.title}</h1>
      <p>Здесь будет открываться интерактивный эксперимент.</p>
    </div>
  `;

  hideSidebar();
  history.replaceState(null, "", `#${id}`);
}

menuButton?.addEventListener("click", showSidebar);
floatingBurger.addEventListener("click", showSidebar);
experimentHomeFab.addEventListener("click", openHome);
sidebarClose?.addEventListener("click", hideSidebar);
backdrop.addEventListener("click", hideSidebar);
homeButton.addEventListener("click", openHome);
brandHome?.addEventListener("click", openHome);



buildNavigation();

function openInitialMenu(){
  if(window.innerWidth < 1050 && !location.hash){
    sidebar.classList.add("open");
    backdrop.classList.add("open");
    menuButton?.setAttribute("aria-expanded", "true");
  }
}

openInitialMenu();

const initialId = location.hash.replace("#", "");
if(initialId && findExperiment(initialId)){
  openExperiment(initialId);
}




</script>
</body>
</html>
